<!DOCTYPE html>
<link rel="icon" th:href="@{/imagenes/icono.jpg}" type="image/jpeg" xmlns:th="http://www.w3.org/1999/xhtml">
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio - App Aduana</title>
    <link rel="stylesheet" th:href="@{/home.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div id="Aplicacion-de-Aduanas">
    <div class="header-content">
        <h1><i class="fas fa-passport"></i> App Aduana</h1>
        <p>SERVICIO NACIONAL DE ADUANAS - CHILE</p>
    </div>
</div>

<div class="main-container">
    <form th:action="@{/login-tramite}" method="get" class="service-card">
        <div class="card-icon">
            <i class="fas fa-plane-departure"></i>
        </div>
        <div class="card-content">
            <h3>Realizar trámite</h3>
            <p>Para ingresar/salir del país</p>
        </div>
        <button type="submit" class="card-button">
            Ir al trámite <i class="fas fa-arrow-right"></i>
        </button>
    </form>

    <form th:action="@{/centro-ayuda}" method="get" class="service-card">
        <div class="card-icon">
            <i class="fas fa-question-circle"></i>
        </div>
        <div class="card-content">
            <h3>Centro de Ayuda</h3>
            <p>Soporte y asistencia</p>
        </div>
        <button type="submit" class="card-button">
            Ir al Centro de Ayuda <i class="fas fa-arrow-right"></i>
        </button>
    </form>
</div>

<div class="contact-info">
    <h3><i class="fas fa-info-circle"></i> Contacto</h3>
    <p><i class="fas fa-map-marker-alt"></i> Dirección: Av. Presidente Errázuriz 1500, Santiago</p>
    <p><i class="fas fa-phone"></i> Teléfono: +56 2 2828 2000</p>
    <p><i class="fas fa-clock"></i> Horario: Lunes a Viernes 09:00 - 14:00 hrs</p>
</div>

</body>
</html>
